id: certificates
name: Certificates
kind: module
tags: [tls, monitoring]
version: "1.0"
labdex: ">=1.3,<2"
description: Checks the TLS certificate of every https service in the inventory (and any other endpoints you list) and warns before they expire. Nothing leaves your network.
pages:
  - {id: certificates, label: Certificates}
settings:
  - {key: warn_days, label: Warn … days before expiry, type: int, default: 21, min: 1, max: 365}
  - {key: critical_days, label: Critical … days before expiry, type: int, default: 7, min: 1, max: 365}
  - {key: extra, label: Other endpoints, type: list, help: "host:port or https://name[:port], e.g. mail.example.net:993"}
  - {key: timeout, label: Timeout per endpoint (seconds), type: int, default: 5, min: 1, max: 60}
actions:
  - {id: check, label: Check certificates, mode: run, schedulable: true, schedule_default: 720}
widgets:
  - {id: expiring, label: Certificates, where: dashboard}
  - {id: host, label: Certificates, where: host}
